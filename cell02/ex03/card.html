<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="profile-card">
        <h1 class="title">Profile Card</h1>

        <!-- Invisible table for layout -->
        <div class="card-content">
            <div class="profile-pic">
                <img src="https://i.pinimg.com/originals/28/df/22/28df2223147fd6962b2e15b0cd21dbd9.png?nii=t" alt="Profile Picture">
            </div>
            <div class="login">Buffet</div>
            <div class="description">CS : Computer Science</div>
            <div class="social-icons">
                <a href="https://www.instagram.com/buf._.fy/">
                    <img src="https://t3.ftcdn.net/jpg/12/25/08/78/240_F_1225087813_fhTDa2OWJcavqrT2OI10xUrGcpncBihg.jpg" alt="ig">
                </a>
                <a href="https://www.facebook.com/FetKungLnwza/">
                    <img src="https://www.iphone-droid.net/wp-content/uploads/2022/01/facebook-and-ig-crash.png" alt="facebook">
                </a>
            </div>
            <button class="contact-btn">Contact</button>
        </div>
    </div>

</body>
</html>
